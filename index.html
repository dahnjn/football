<style>

COLOUR and TYPE: midnight navy housing, game palette inside; bitmap font drawn in canvas

:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0c24;color:#c9d0ff;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.4 system-ui,sans-serif;
 background:radial-gradient(ellipse at 50% 40%,#1b2160 0%,#0a0c24 70%)}

#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3)}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;border:none;font:700 24px system-ui;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#bA{right:18px;bottom:52px;background:#d62828}

</head>
<body>
<div id="bezel"><canvas id="c" width="512" height="448"></canvas></div>
<div id="hint">1P: <b>Arrows/WASD</b> move · <b>Space</b> = A · <b>X</b> = B &nbsp;|&nbsp; 2P: P1 <b>WASD F G</b> · P2 <b>Arrows / .</b> &nbsp;|&nbsp; Gamepads work · <b>M</b> mute · <b>P</b> pause · <b>N</b> all names</div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button class="tb" id="bB">B</button><button class="tb" id="bA">A</button></div>
<script>
{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=256,H=224,CW=512,CH=448,FT=46,YD=6,GL=60,GR=660,SX=3,SY=2.7,VW=512/3,FH=405;
let camY=0;
const scrX=x=>Math.round((x-cam)*SX),scrY=y=>Math.round(40+y*SY-camY);
const UI=()=>ctx.setTransform(2,0,0,2,0,0),NATIVE=()=>ctx.setTransform(1,0,0,1,0,0);
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(rnd()*a.length)|0],hyp=Math.hypot;
let T=0;

// ================= BITMAP FONT =================
const FONT={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
' ':[0,0,0,0,0,0,0],'!':[4,4,4,4,4,0,4],'?':[14,17,1,2,4,0,4],':':[0,12,12,0,12,12,0],'-':[0,0,0,14,0,0,0],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],"'":[4,4,8,0,0,0,0],'/':[1,1,2,4,8,16,16],'+':[0,4,4,31,4,4,0],'=':[0,0,31,0,31,0,0],'&':[12,18,20,8,21,18,13],'#':[10,10,31,10,31,10,10],'<':[2,4,8,16,8,4,2],'>':[8,4,2,1,2,4,8],'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8]};
const tw=(s,sc=1)=>String(s).length*6*sc-sc;
function txt(s,x,y,col,sc=1,align='left',sh=null,g=ctx){
  s=String(s).toUpperCase();
  if(align==='center')x=Math.round(x-tw(s,sc)/2);else if(align==='right')x=Math.round(x-tw(s,sc));
  if(sh)raw(s,x+(sc>2?2:1),y+(sc>2?2:1),sh,sc,g);
  raw(s,x,y,col,sc,g);
}
function raw(s,x,y,col,sc,g){
  g.fillStyle=col;
  for(let i=0;i<s.length;i++){const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<7;r++){const row=gl[r];if(!row)continue;for(let c=0;c<5;c++)if(row&(16>>c))g.fillRect(x+(i*6+c)*sc,y+r*sc,sc,sc);}}
}
function otxt(s,x,y,col,sc,align,oc='#000'){
  const o=sc>=3?2:1;
  for(const[dx,dy]of[[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o],[o,o+o]])txt(s,x+dx,y+dy,oc,sc,align);
  txt(s,x,y,col,sc,align);
}
function rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,f){return'rgb('+rgb(h).map(v=>Math.round(f>0?v+(255-v)*f:v*(1+f))).join(',')+')';}

// ================= TEAMS =================
const TEAMS=[
 {school:'DIAPER STATE',school2:'UNIVERSITY',mascot:'PACIFIERS',abbr:'DSU',c1:'#f57c1f',c2:'#1e8f3e',helmet:'#f57c1f',stripe:'#1e8f3e',jersey:'#1e8f3e',pants:'#f57c1f',letter:'D',icon:'pacifier',logo:['#f57c1f','#1e8f3e','#ffffff']},
 {school:'EASTERN',school2:'DIAPER',mascot:'ONESIES',abbr:'EDU',c1:'#d62828',c2:'#1d3fa0',helmet:'#1d3fa0',stripe:'#d62828',jersey:'#d62828',pants:'#ffffff',letter:'E',icon:'onesie',logo:['#d62828','#1d3fa0','#ffffff']},
 {school:'WESTERN',school2:'DIAPER',mascot:'BOUNCERS',abbr:'WDU',c1:'#c3c9d1',c2:'#141414',helmet:'#c3c9d1',stripe:'#141414',jersey:'#1b1b1b',pants:'#c3c9d1',letter:'W',icon:'bouncer',logo:['#c3c9d1','#141414','#ffffff']},
 {school:'DIAPER',school2:'TECH',mascot:'SOUND MACHINES',abbr:'DT',c1:'#f2c230',c2:'#5e2b91',helmet:'#f2c230',stripe:'#5e2b91',jersey:'#6a35a8',pants:'#f2c230',letter:'T',icon:'sound',logo:['#f2c230','#5e2b91','#ffffff']},
];
const fullName=t=>t.school+' '+t.school2;
// Rosters follow formation order. The QB is a two-way star and also plays linebacker.
// Offense: OL,OL,OL,QB,RB,WR,WR  Defense: DL,DL,LB,CB,CB,S,S
const nameSkin=n=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7)%4;
const ROSTERS=[
 {o:['TATER','PUDDIN','BEAN','MANGO','PEACH','KIWI','CLEM'],d:['CHUNK','BUTTER','MANGO','PIPER','ZIGGY','HONEY','BIRDIE']},
 {o:['GUS','BUBBA','HANK','MOSEY','OTIS','JUNO','MILO'],d:['TANK','BRUTUS','MOSEY','POPPY','REMY','IVY','NOVA']},
 {o:['HANS','AXEL','ROLF','EAMES','EERO','ARNE','RAY'],d:['BJORN','SVEN','EAMES','GRETA','FINN','INGRID','ELSA']},
 {o:['BEAR','OX','MOOSE','FOX','BUCK','WREN','ROBIN'],d:['BISON','BOAR','FOX','HAWK','LYNX','OWL','RAVEN']},
];

// ================= LOGOS (pixel monograms, classic outlined style) =================
const N=32;
const R=(x0,y0,x1,y1)=>(x,y)=>x>=x0&&x<x1+1&&y>=y0&&y<y1+1;
const E=(cx,cy,rx,ry)=>(x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1;
const L=(x0,y0,x1,y1,t)=>(x,y)=>{const dx=x1-x0,dy=y1-y0;let u=((x-x0)*dx+(y-y0)*dy)/(dx*dx+dy*dy);u=clamp(u,0,1);return hyp(x-x0-u*dx,y-y0-u*dy)<=t/2;};
const AND=(a,b)=>(x,y)=>a(x,y)&&b(x,y),NOT=a=>(x,y)=>!a(x,y);
const RING=(cx,cy,ro,ri)=>AND(E(cx,cy,ro,ro),NOT(E(cx,cy,ri,ri)));
function paint(g,v,f){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(f(x+.5,y+.5))g[y*N+x]=v;}
function renderMark(g,cols,o1,o2){
  const c=mkc(N,N),x=c.getContext('2d'),fl=[];
  for(let i=0;i<N*N;i++)if(g[i])fl.push(i);
  const at=(px,py)=>px<0||py<0||px>=N||py>=N?0:g[py*N+px];
  for(let py=0;py<N;py++)for(let px=0;px<N;px++){
    const v=g[py*N+px];let col=null;
    if(v){const b=cols[v];
      if(at(px-1,py-1)!==v&&at(px+1,py+1)===v)col=shade(b,.35);
      else if(at(px+1,py+1)!==v&&at(px-1,py-1)===v)col=shade(b,-.22);
      else col=b;
    }else{let m=99;for(const j of fl){const d=hyp(px-j%N,py-((j/N)|0));if(d<m)m=d;}
      if(m<=1.5)col=o1;else if(m<=2.5)col=o2;}
    if(col){x.fillStyle=col;x.fillRect(px,py,1,1);}
  }
  return c;
}
function letterMask(ch){
  const g=new Uint8Array(N*N);
  if(ch==='D'){paint(g,1,R(7,4,12,27));paint(g,1,R(5,4,14,7));paint(g,1,R(5,24,14,27));
    paint(g,1,AND(AND(E(13,16,13,12.5),NOT(E(13,16,6.5,7))),(x)=>x>=13));}
  if(ch==='E'){paint(g,1,R(7,4,13,27));paint(g,1,R(5,4,25,8));paint(g,1,R(7,14,20,17));paint(g,1,R(5,23,25,27));
    paint(g,1,R(23,4,25,11));paint(g,1,R(23,20,25,27));paint(g,1,R(19,12,20,19));}
  if(ch==='W'){paint(g,1,L(6,5,11,26,5));paint(g,1,L(11,26,16,11,3.5));paint(g,1,L(16,11,21,26,3.5));paint(g,1,L(21,26,26,5,5));
    paint(g,1,R(3,4,9,6));paint(g,1,R(23,4,29,6));}
  if(ch==='T'){paint(g,1,R(4,4,27,9));paint(g,1,R(13,4,18,27));paint(g,1,R(10,24,21,27));paint(g,1,R(4,4,6,13));paint(g,1,R(25,4,27,13));}
  return g;
}
function iconMask(k){
  const g=new Uint8Array(N*N);
  if(k==='pacifier'){paint(g,3,E(16,25,4,5));paint(g,2,RING(16,9,7,4));paint(g,1,E(16,18,13,7));paint(g,2,E(16,18,3.5,3.5));}
  if(k==='onesie'){paint(g,1,R(10,8,21,23));paint(g,1,L(11,10,6,15,6));paint(g,1,L(20,10,25,15,6));paint(g,2,E(5.5,16,3,3));paint(g,2,E(26.5,16,3,3));
    paint(g,1,R(12,23,19,27));paint(g,2,R(10,14,21,15));paint(g,0,E(16,7,4.5,3.5));
    paint(g,2,AND(AND(E(16,7,6.5,5),NOT(E(16,7,4.5,3.5))),(x,y)=>y>=7));paint(g,3,R(13,25,13,25));paint(g,3,R(15,25,16,25));paint(g,3,R(18,25,18,25));}
  if(k==='bouncer'){paint(g,1,AND(E(16,8,11,8),(x,y)=>y>=8));paint(g,2,L(5,8,27,8,2));
    paint(g,2,L(16,15,10,18,2.5));paint(g,2,L(10,18,22,20.5,2.5));paint(g,2,L(22,20.5,10,23,2.5));paint(g,1,R(7,24,25,27));}
  if(k==='sound'){const w1=AND(RING(16,18,11.5,10),(x,y)=>Math.abs(x-16)>9.2&&Math.abs(y-18)<5.5),w2=AND(RING(16,18,14.5,13),(x,y)=>Math.abs(x-16)>11.5&&Math.abs(y-18)<7);
    paint(g,2,w1);paint(g,2,w2);paint(g,1,R(9,12,23,26));paint(g,1,E(16,12,7,4));
    for(const x of[12,16,20])for(const y of[15,18,21])paint(g,3,R(x-1,y,x,y+1));paint(g,2,R(9,24,23,26));}
  return g;
}
const ICON_COLS={pacifier:[0,'#f57c1f','#1e8f3e','#ffe9c4'],onesie:[0,'#d62828','#1d3fa0','#ffffff'],bouncer:[0,'#1b1b1b','#c3c9d1'],sound:[0,'#f2c230','#5e2b91','#3a1a5c']};
const LOGOS=TEAMS.map(t=>renderMark(letterMask(t.letter),[0,t.logo[0]],t.logo[1],t.logo[2]));
const ICONS=TEAMS.map(t=>renderMark(iconMask(t.icon),ICON_COLS[t.icon],t.icon==='bouncer'?'#ffffff':'#111111',t.icon==='bouncer'?'#111111':'#ffffff'));

// ================= SPRITES =================
const SKINS=['#f1c27d','#c68642','#8d5524','#e0ac69'];
// ---- procedural 22x30 player sprites built from joints ----
const SW=22,SH=30;
const POSES={
 stand:{kF:[14,25],fF:[15,29],kB:[10,25],fB:[9,29],eF:[15,17],hF:[15,20],eB:[8,17],hB:[8,20]},
 run0:{kF:[16,24],fF:[18,28],kB:[9,25],fB:[5,27],eF:[12,17],hF:[9,18],eB:[12,16],hB:[15,15]},
 run1:{kF:[13,25],fF:[13,29],kB:[13,24],fB:[9,26],eF:[14,17],hF:[15,19],eB:[10,17],hB:[10,19],bob:-1},
 run2:{kF:[9,25],fF:[5,27],kB:[16,24],fB:[18,28],eF:[16,15],hF:[19,14],eB:[7,16],hB:[6,18]},
 run3:{kF:[14,24],fF:[10,26],kB:[13,25],fB:[13,29],eF:[14,17],hF:[15,19],eB:[10,17],hB:[10,19],bob:-1},
 throw:{kF:[17,24],fF:[20,29],kB:[8,25],fB:[4,29],eF:[9,9],hF:[6,4],eB:[14,14],hB:[19,13],ball:[5,3]},
 release:{kF:[17,24],fF:[20,29],kB:[8,25],fB:[4,29],eF:[17,10],hF:[20,7],eB:[11,16],hB:[8,18]},
 catch:{kF:[15,23],fF:[14,27],kB:[11,25],fB:[10,29],eF:[15,8],hF:[16,3],eB:[11,8],hB:[12,3],bob:-1,ball:[15,1]},
 cele:{kF:[14,25],fF:[16,29],kB:[10,25],fB:[8,29],eF:[17,9],hF:[20,4],eB:[7,9],hB:[4,4]},
 kick:{kF:[17,20],fF:[21,17],kB:[11,25],fB:[11,29],eF:[17,15],hF:[20,17],eB:[6,13],hB:[3,11]},
 tackle:{kF:[10,24],fF:[6,26],kB:[9,25],fB:[4,28],eF:[17,13],hF:[21,13],eB:[16,14],hB:[20,15]},
 spikeUp:{kF:[15,25],fF:[18,29],kB:[9,25],fB:[6,29],eF:[16,7],hF:[17,1],eB:[7,15],hB:[5,18],ball:[17,0]},
 spikeDown:{kF:[16,24],fF:[19,29],kB:[9,25],fB:[5,29],eF:[18,15],hF:[21,20],eB:[7,15],hB:[5,18]},
 push:{kF:[15,25],fF:[17,29],kB:[9,25],fB:[6,29],eF:[17,14],hF:[20,14],eB:[16,15],hB:[19,16]},
};
const DIG3=['111101101101111','010110010010111','111001111100111','111001011001111','101101111001001','111100111001111','111100111101111','111001010010010','111101111101111','111101111001111'];
function buildBody(pose,carry){
  const P=POSES[pose],b=P.bob||0,g=new Uint8Array(SW*SH);
  const S=(f,v)=>{for(let y=0;y<SH;y++)for(let x=0;x<SW;x++)if(f(x+.5,y+.5))g[y*SW+x]=v;};
  const sh=([x,y])=>[x,y+b];
  const hipF=sh([13,21]),hipB=sh([10,21]),shF=sh([14,13]),shB=sh([9,13]);
  let eF=sh(P.eF),hF=sh(P.hF);if(carry){eF=sh([13,17]);hF=sh([16,15]);}
  const eB=sh(P.eB),hB=sh(P.hB),kF=sh(P.kF),kB=sh(P.kB),fF=P.fF,fB=P.fB;
  const arm=(s,e,h)=>{S(L(s[0],s[1],e[0],e[1],3.4),5);S(L(e[0],e[1],h[0],h[1],2.6),4);S(E(h[0],h[1],1.4,1.4),4);};
  const leg=(hp,k,f)=>{S(L(hp[0],hp[1],k[0],k[1],3.8),8);S(L(k[0],k[1],f[0],f[1]-1,3),9);S(R(f[0]-1,f[1]-1,f[0]+2,f[1]),10);};
  arm(shB,eB,hB);leg(hipB,kB,fB);
  S(R(7,11+b,16,19+b),5);S(E(11.5,12+b,6,2.8),5);S(R(6,12+b,6,13+b),6);S(R(17,12+b,17,13+b),6);
  S(R(8,19+b,15,21+b),8);S(R(8,19+b,15,19+b),12);
  leg(hipF,kF,fF);
  S(E(12,6+b,4.6,4.6),1);S(AND(E(12,6+b,4.6,4.6),(x,y)=>y>=2+b&&y<3+b&&x<15),2);
  S(R(14,5+b,15,8+b),4);S(R(14,6+b,14,6+b),11);S(R(10,6+b,10,7+b),11);
  S(L(16.4,4.5+b,16.4,9.4+b,1.3),3);S(L(14.5,8.6+b,17,8.6+b,1.1),3);
  arm(shF,eF,hF);
  return g;
}
const sprCache={};
function getSpr(ti,skin,pose,flip,lying,carry=false,num=null){
  const k=[ti,skin,pose,flip?1:0,lying?1:0,carry?1:0,num].join('_');if(sprCache[k])return sprCache[k];
  const t=TEAMS[ti],b=POSES[pose].bob||0;
  const pal=[null,t.helmet,t.stripe,'#d0d0d0',SKINS[skin],t.jersey,t.stripe,'#ffffff',t.pants,'#f2f2f2','#161616','#24140c',t.stripe];
  const g=buildBody(pose,carry),G=new Uint8Array(SW*SH);
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++)G[y*SW+(flip?SW-1-x:x)]=g[y*SW+x];
  if(num!=null&&!lying){const ds=String(num).padStart(2,'0'),cx=flip?SW-1-11.5:11.5,x0=Math.round(cx-3.5),y0=14+b;
    for(let d=0;d<2;d++){const gl=DIG3[+ds[d]];for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(gl[r*3+c]==='1'){const i=(y0+r)*SW+x0+d*4+c;if(G[i]===5)G[i]=7;}}}
  const at=(x,y)=>x<0||y<0||x>=SW||y>=SH?0:G[y*SW+x];
  const c0=mkc(SW,SH),x0=c0.getContext('2d');
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const v=G[y*SW+x];let col=null;

  SFX.kick();const k=ball.holder;
  if(play.kind==='punt'){const d=36+rnd()*14;launch('punt',k.x,k.y,Math.min(play.los+d*YD,716),clamp(75+(rnd()-.5)*60,12,138),2,70,null);}
  else{const dist=game.ytg+17,p=clamp(1.04-(dist-18)*.021,.08,.98),good=rnd()<p;
    launch('fg',k.x,k.y,718,good?75:75+(rnd()<.5?-1:1)*(16+rnd()*10),1.3,45,null);ball.good=good;startScene('fg',{p:play.rb,good},2.1);if(good)scene.next={type:'fans',d:{p:play.rb},dur:2.2};}
}
function doSpin(p){p.spin=.4;p.spinCd=1.2;SFX.spin();}
function doDive(p,dx,dy){
  if(!dx&&!dy)dx=p.face;const l=hyp(dx,dy);p.vx=dx/l*p.speed*2.3;p.vy=dy/l*p.speed*2.3;p.dive=.28;p.grounded=.28+.55;SFX.dive();

function switchCtrl(s){
  const bx=ball.state==='air'?ball.x1:ball.x,by=ball.state==='air'?ball.y1:ball.y;let best=null,bd=1e9;
  for(const p of play.players){if(p.side!==s||p===play.ctrl[s])continue;const d=hyp(p.x-bx,p.y-by);if(d<bd){bd=d;best=p;}}
  if(best)play.ctrl[s]=best;

function addFloat(text,x,y,col='#ffffff'){floats.push({text,x,y,t:0,col});}

// ---------- AI goals ----------
function followRoute(p){
  if(!p.route||p.ri>=p.route.length)return p.role==='QB'||p.blocker?null:{x:p.x+dirOf(p.side)*12,y:p.y,mul:.35};
  const[tx,ty]=p.route[p.ri];if(hyp(tx-p.x,ty-p.y)<4){p.ri++;return followRoute(p);}
  return{x:tx,y:ty,mul:1};
}
function pursue(p,c,mul=1){const d=hyp(p.x-c.x,p.y-c.y),t=Math.min(d/p.speed,.8);return{x:c.x+c.vx*t,y:c.y+c.vy*t,mul};}
function coverGoal(p,r){if(!r)return null;return{x:r.x+r.vx*.3+dirOf(r.side)*5,y:r.y+r.vy*.3,mul:play.coverF};}
function blockGoal(p,prot){
  let t=p.blockT;
  if(!t||t.shedFrom===p||t.stun>0||t.grounded>0||hyp(t.x-p.x,t.y-p.y)>80){
    if(t&&t.targetedBy===p)t.targetedBy=null;t=null;let best=1e9;
    for(const d of play.players){if(d.side===p.side||d.stun>0||d.grounded>0||d.shedFrom===p)continue;
      const dd=hyp(d.x-p.x,d.y-p.y);if(dd>80)continue;
      const sc=dd+(prot?hyp(d.x-prot.x,d.y-prot.y)*.5:0)+(d.engaged&&d.engaged!==p?40:0)+(d.targetedBy&&d.targetedBy!==p?25:0);
      if(sc<best){best=sc;t=d;}}
    p.blockT=t;if(t)t.targetedBy=p;
  }
  if(!t)return{x:p.x+dirOf(p.side)*8,y:p.y,mul:.3};
  if(prot){const ax=t.x-prot.x,ay=t.y-prot.y,l=hyp(ax,ay)||1;return{x:t.x-ax/l*4,y:t.y-ay/l*4,mul:1};}
  return{x:t.x,y:t.y,mul:1};
}
function runnerGoal(p){
  const dr=dirOf(p.side);let best=[dr,0],bs=-1e9,near=99;
  for(let a=-80;a<=80;a+=16){const r=a*Math.PI/180,dx=Math.cos(r)*dr,dy=Math.sin(r);let s=Math.cos(r)*1.2;const lx=p.x+dx*22,ly=p.y+dy*22;
    for(const d of play.players){if(d.side===p.side||d.stun>0||d.engaged||d.grounded>0)continue;const dd=hyp(d.x-lx,d.y-ly);if(dd<40)s-=(40-dd)/22;}
    if(ly<10)s-=(10-ly)*.15;if(ly>140)s-=(ly-140)*.15;if(s>bs){bs=s;best=[dx,dy];}}
  for(const d of play.players){if(d.side!==p.side&&!d.engaged&&d.stun<=0)near=Math.min(near,hyp(d.x-p.x,d.y-p.y));}
  if(near<10&&p.spinCd<=0&&rnd()<.08)doSpin(p);
  return{x:p.x+best[0]*30,y:p.y+best[1]*30,mul:1};
}
function aiGoal(p){
  const off=game.poss,isOff=p.side===off,m=play.mode,car=play.carrier,los=play.los;
  if(m==='kick'){
    if(isOff){if(p.role==='WR')return{x:p.x+30,y:p.y,mul:1};if(p.route)return followRoute(p);if(p.role==='OL')return blockGoal(p,ball.state==='held'?ball.holder:play.rb);return null;}
    if(p.role==='DL'||p.role==='LB')return{x:ball.x,y:ball.y,mul:.75};
    if(ball.kind==='punt'&&ball.state==='air')return{x:ball.x1,y:ball.y1,mul:.8};
    return null;
  }
  if(m==='air'){
    const lx=ball.x1,ly=ball.y1;
    if(isOff){if(p===ball.target)return{x:lx,y:ly,mul:1};if(p.blocker)return blockGoal(p,play.qb);return followRoute(p);}
    if(hyp(p.x-lx,p.y-ly)<60||p.cover===ball.target)return{x:lx,y:ly,mul:1};
    return{x:lx,y:ly,mul:.6};
  }
  if(m==='pocket'){
    if(isOff){if(p===car||!p.blocker)return followRoute(p);return blockGoal(p,car);}
    if(p.role==='DL')return pursue(p,car);
    if(p.role==='CB')return coverGoal(p,p.cover);
    if(p.role==='LB'){if(p.cover&&p.cover.route&&!p.cover.blocker)return coverGoal(p,p.cover);if(play.t>2)return pursue(p,car);return{x:Math.max(car.x+28,los+8),y:car.y,mul:.8};}
    if(p.role==='S'){const r=p.cover;if(r)return{x:Math.max(r.x+(play.offPlay===3&&play.matched?26:18),los+24),y:r.y*.7+p.sy*.3,mul:.95};}
    return null;
  }
  if(m==='handoff'){
    if(isOff){if(p===play.rb||p===play.qb)return followRoute(p);return blockGoal(p,play.rb);}
    return pursue(p,play.rb,.9);
  }
  if(m==='run'&&car){
    if(p===car){if(play.kind==='run'&&p===play.rb&&p.route&&p.ri<p.route.length-1&&p.x<los)return followRoute(p);return runnerGoal(p);}
    if(car.side===p.side)return blockGoal(p,car);
    if(!humanInp(p.side)&&p.grounded<=0&&p.stun<=0&&!p.engaged){const d=hyp(p.x-car.x,p.y-car.y);if(d<15&&d>6&&rnd()<.025)doDive(p,car.x-p.x,car.y-p.y);}
    return pursue(p,car);
  }
  return null;
}
function movePlayer(p,dt,goal,hi){
  if(p.stun>0){p.stun-=dt;p.vx*=.8;p.vy*=.8;return;}
  if(p.grounded>0){p.grounded-=dt;if(p.dive>0)p.dive-=dt;else{p.vx=0;p.vy=0;}p.x+=p.vx*dt;p.y+=p.vy*dt;return;}
  let spd=p.speed*(p.side!==game.poss&&play.matched?1.1:1);
  if(p.engaged)spd*=.12;
  let vx=0,vy=0;
  if(hi){const l=hyp(hi.x,hi.y);if(l){vx=hi.x/l*spd*1.05;vy=hi.y/l*spd*1.05;}}
  else if(goal){const dx=goal.x-p.x,dy=goal.y-p.y,l=hyp(dx,dy);if(l>1.5){const s=Math.min(spd*(goal.mul??1),l/dt);vx=dx/l*s;vy=dy/l*s;}}
  const k=Math.min(1,dt*12);p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(Math.abs(p.vx)>3)p.face=Math.sign(p.vx);
  const sp=hyp(p.vx,p.vy);if(sp>4)p.anim+=dt*sp*.18;
}

// ---------- live update ----------
function updatePresnap(dt){
  play.t+=dt;const off=game.poss,def=1-off,oi=humanInp(off),di=humanInp(def);
  if(di){if(di.bP)switchCtrl(def);const c=play.ctrl[def];movePlayer(c,dt,null,di);c.x=Math.max(c.x,play.los+5);c.y=clamp(c.y,2,148);}
  if(oi?oi.aP:play.t>1)snap();
}
function updateLive(dt){
  play.t+=dt;game.clock=Math.max(0,game.clock-dt);
  const off=game.poss,los=play.los;
  if(play.mode==='handoff'&&!play.tossed&&play.t>=.28){play.tossed=true;const rb=play.rb;launch('toss',play.qb.x,play.qb.y,rb.x+rb.vx*.15,rb.y+rb.vy*.15,.15,3,rb);}
  if(play.mode==='kick'&&play.kickAt!=null&&play.t>=play.kickAt&&ball.state==='held'){play.kickAt=null;doKick();}
  if(play.mode==='pocket'&&(ball.holder.x>los+2||(play.noPass&&play.t>.65))){play.mode='run';play.qbRun=true;}
  if(play.relT>0)play.relT-=dt;
  const car=ball.state==='held'&&(play.mode==='pocket'||play.mode==='run')?ball.holder:null;
  play.carrier=car;
  // CPU QB
  if(play.mode==='pocket'&&!humanInp(off)&&!play.noPass){
    if(!play.cpuThrowAt)play.cpuThrowAt=(play.offPlay===3?1.5:.9)+rnd()*.8;
    let pres=99;for(const d of play.players)if(d.side!==off&&!d.engaged)pres=Math.min(pres,hyp(d.x-car.x,d.y-car.y));
    if(play.t>play.cpuThrowAt||(pres<14&&play.t>.5)){
      let best=null,bo=-1e9;
      for(const r of play.recv){const px=r.x+r.vx*.8,py=r.y+r.vy*.8;let md=99;for(const d of play.players)if(d.side!==off)md=Math.min(md,hyp(d.x-px,d.y-py));
        const sc=md+(r.x-los)*.04;if(sc>bo){bo=sc;best=r;}}
      if(bo>9||play.t>2.6||pres<14)throwTo(car,best);
    }
  }
  // human control + ctrl updates
  for(const s of[0,1]){
    const hi=humanInp(s);if(!hi)continue;
    if(car&&car.side===s)play.ctrl[s]=car;
    else if(car&&play.lastCarSide===s)switchCtrl(s);
    else if(!play.ctrl[s]||play.ctrl[s].side!==s)switchCtrl(s);
    const c=play.ctrl[s];if(!c)continue;
    if(c===car){
      if(play.mode==='pocket'&&!play.noPass){if(hi.bP&&play.recv.length){play.tgt=(play.tgt+1)%play.recv.length;SFX.blip();}if(hi.aP)throwTo(c,play.recv[play.tgt]);}
      else if(hi.aP&&c.spinCd<=0)doSpin(c);
    }else if(play.mode!=='kick'&&!(play.mode==='air'&&s===off)&&play.mode!=='handoff'){
      if(hi.bP)switchCtrl(s);
      else if(hi.aP){if(c.engaged)c.engaged.blockTimer-=.35;else if(c.grounded<=0&&c.stun<=0)doDive(c,hi.x,hi.y);}
    }
  }
  if(car)play.lastCarSide=car.side;
  // movement
  for(const p of play.players){
    p.spin=Math.max(0,p.spin-dt);p.spinCd-=dt;if(p.shedT>0){p.shedT-=dt;if(p.shedT<=0)p.shedFrom=null;}
    const s=p.side,hi=humanInp(s);
    const hum=hi&&play.ctrl[s]===p&&play.mode!=='kick'&&!(play.mode==='handoff'&&p===play.qb)&&!(play.mode==='air'&&s===off&&p!==play.qb);
    movePlayer(p,dt,hum?null:aiGoal(p),hum?hi:null);
    if(p!==car){p.y=clamp(p.y,-8,158);}
    p.x=clamp(p.x,2,718);
  }
  // blocking engagement
  for(const b of play.players){
    const t=b.blockT;if(!t)continue;
    const d=hyp(t.x-b.x,t.y-b.y);
    if(t.engaged===b){
      b.blockTimer-=dt;
      if(d>12||t.grounded>0)t.engaged=null;
      else if(b.blockTimer<=0){t.engaged=null;t.shedFrom=b;t.shedT=1.5;b.blockT=null;t.targetedBy=null;b.stun=.3;}
    }else if(d<8&&!t.engaged&&t.shedFrom!==b&&t.stun<=0&&t.grounded<=0&&b.stun<=0&&b.grounded<=0){
      t.engaged=b;b.blockTimer=(b.role==='OL'?1.5+rnd()*1.5:.8+rnd())*(play.matched?.45:1);
    }
  }
  updateBall(dt);
  if(play.mode==='over')return;
  const c2=ball.state==='held'&&(play.mode==='pocket'||play.mode==='run')?ball.holder:null;
  if(c2){
    const dr=dirOf(c2.side);
    if((dr>0&&c2.x>=GR)||(dr<0&&c2.x<=GL)){endPlay({type:'td',side:c2.side});startScene('td',{p:c2},3.4);scene.next={type:'fans',d:{p:c2},dur:2.6};return;}
    if(c2.y<-3||c2.y>153){addFloat('OUT OF BOUNDS',c2.x,c2.y+40);endPlay({type:'down',x:c2.x,side:c2.side,oob:true});return;}
    checkTackle(c2);

function updateBall(dt){
  if(ball.state==='held'){const h=ball.holder;ball.x=h.x+h.face*3;ball.y=h.y;ball.z=5;}
  else if(ball.state==='air'){
    ball.t+=dt;const u=Math.min(1,ball.t/ball.dur);
    ball.x=ball.x0+(ball.x1-ball.x0)*u;ball.y=ball.y0+(ball.y1-ball.y0)*u;ball.z=5+ball.peak*4*u*(1-u);
    if(u>=1)landBall();
  }else ball.z=Math.max(0,ball.z-dt*30);
}
function landBall(){
  const k=ball.kind;
  if(k==='snap'){const h=ball.target;ball={state:'held',holder:h,x:h.x,y:h.y,z:5};play.kickAt=play.t+(play.kind==='punt'?.4:.5);}
  else if(k==='toss'){const h=ball.target;ball={state:'held',holder:h,x:h.x,y:h.y,z:5};play.mode='run';}
  else if(k==='pass')resolvePass();
  else if(k==='punt'){ball.state='dead';endPlay({type:'punt',landX:ball.x1});}
  else if(k==='fg'){ball.state='dead';endPlay({type:'fg',good:ball.good});}
}
function resolvePass(){
  const off=game.poss,lx=ball.x1,ly=ball.y1;
  const near=f=>play.players.filter(f).map(p=>[p,hyp(p.x-lx,p.y-ly)]).sort((a,b)=>a[1]-b[1])[0]||[null,99];
  const[r,dr]=near(p=>p.side===off&&p.role!=='QB'&&p.stun<=0&&p.grounded<=0);
  const[d,dd]=near(p=>p.side!==off&&p.stun<=0&&(p.grounded<=0||p.dive>0));
  let res;
  if(dr>11)res=dd<9&&rnd()<.35?'int':'inc';
  else if(dd<9){if(dd<dr+2){const x=rnd();res=x<.3?'int':x<.68?'inc':'catch';}else res=rnd()<.75?'catch':'inc';}
  else res=rnd()<.96?'catch':'inc';
  if(res==='catch'){ball={state:'held',holder:r,x:r.x,y:r.y,z:5};play.mode='run';SFX.catch();addFloat('CATCH!',r.x,r.y-14,'#7cfc00');
    if(lx-play.los>85||dd<12)startScene('catch',{p:r,def:dd<14?d:null},1.8);}
  else if(res==='int'){ball={state:'held',holder:d,x:d.x,y:d.y,z:5};play.mode='run';play.intercepted=true;d.grounded=0;d.dive=0;SFX.waah();addFloat('PICKED OFF!',d.x,d.y-14,'#ff6b6b');startScene('int',{p:d,rec:r},1.9);scene.next={type:'fans',d:{p:d},dur:2.2};}
  else{ball.state='dead';endPlay({type:'inc'});}
}
function checkTackle(c){
  for(const d of play.players){
    if(d.side===c.side||d.stun>0||d.engaged)continue;if(d.grounded>0&&d.dive<=0)continue;
    if(hyp(d.x-c.x,(d.y-c.y)*1.2)>(d.dive>0?8:6))continue;
    if(c.spin>0)continue;
    const pT=play.mode==='pocket'?.9:d.dive>0?.9:.78;
    if(rnd()<pT){c.grounded=99;c.vx=c.vy=0;d.grounded=Math.max(d.grounded,.8);SFX.tackle();const sk=play.mode==='pocket';endPlay({type:'down',x:c.x,side:c.side,sack:sk});if(sk&&c.x<play.los)startScene('sack',{p:c,def:d},2);return;}
    d.stun=.9;addFloat('BROKE IT!',c.x,c.y-14,'#ffe14d');SFX.spin();
  }
}
const TD_SUBS=['DIAPER DUNK!','BLOWOUT!!','TUMMY TIME!','SPIKE THE BINKY!','GOO GOO GA GA!','BURP-TASTIC!'];
function endPlay(info){
  if(play.mode==='over')return;
  play.mode='over';overT=0;
  const off=game.poss,def=1-off,oldY=game.ytg,cy=v=>clamp(Math.round(v),1,99);
  const Nx=(poss,y)=>({poss,ytg:cy(y),down:1,firstYtg:Math.max(0,cy(y)-10)});
  const o={title:'',sub:'',next:null,score:null,big:false,time:2,runoff:true,col:'#ffffff'};
  const downs=newY=>{
    const dist=newY-game.firstYtg;
    if(newY<=game.firstYtg){o.sub='FIRST DOWN! GOO GOO!';o.next=Nx(off,newY);}
    else if(game.down>=4){o.sub='TURNOVER ON DOWNS';o.next=Nx(def,100-newY);}
    else{o.next={poss:off,ytg:newY,down:game.down+1,firstYtg:game.firstYtg};o.sub=ORD[game.down]+' & '+(game.firstYtg===0?'GOAL':dist);}
  };
  if(info.type==='td'){
    const s=info.side;o.score=[s,7];o.title='TOUCHDOWN!';o.sub=pick(TD_SUBS)+'  +7';o.big=true;o.time=1.6;o.next=Nx(1-s,75);o.tdSide=s;
    SFX.td();hype=3.4;for(let i=0;i<90;i++)confetti.push({x:rnd()*256,y:-rnd()*80,vx:(rnd()-.5)*30,vy:30+rnd()*40,c:pick([teamOf(s).c1,teamOf(s).c2,'#ffffff','#ffe14d'])});
  }else if(info.type==='punt'){
    const land=oldY-(info.landX-play.los)/YD;o.title='PUNT!';o.sub=Math.round((Math.min(info.landX,GR)-play.los)/YD)+' YARD BOOT';
    if(land<=0){o.sub='TOUCHBACK';o.next=Nx(def,80);}else o.next=Nx(def,100-land);SFX.whistle();
  }else if(info.type==='fg'){
    if(info.good){o.score=[off,3];o.title="IT'S GOOD!";o.sub='+3 POINTS';o.next=Nx(def,75);o.col='#7cfc00';SFX.good();hype=2;}
    else{o.title='NO GOOD!';o.sub='WAAAH! WIDE '+(ball.y1<75?'LEFT':'RIGHT');o.next=Nx(def,Math.min(80,100-oldY));o.col='#ff6b6b';SFX.waah();}
  }else if(info.type==='inc'){
    o.title='INCOMPLETE';o.runoff=false;downs(oldY);
    if(!o.sub.startsWith('TURN'))o.sub=pick(['WHOOPSIE!','BUTTERFINGERS!','SPIT UP!'])+'  '+o.sub;SFX.whistle();
  }else if(info.type==='down'){
    if(info.side!==off){
      let y2=(info.x-GL)/YD;o.title='INTERCEPTED!';o.col='#ff6b6b';
      if(y2>=100){o.sub='TOUCHBACK - NAP TIME!';o.next=Nx(def,80);}else{o.sub='NAP TIME! '+teamOf(def).abbr+' BALL';o.next=Nx(def,y2);}
    }else{
      const raw=(GR-info.x)/YD;
      if(raw>=100){o.score=[def,2];o.title='SAFETY!';o.sub='STINKY DIAPER! +2';o.next=Nx(def,65);o.col='#ff6b6b';SFX.waah();}
      else{const newY=cy(raw),g=oldY-newY;if(g>=20&&!scene)startScene('fans',{p:{side:off}},2.2);
        o.title=info.sack&&g<0?'SACKED! WAAAH!':g>0?'GAIN OF '+g:g===0?'NO GAIN':'LOSS OF '+(-g);
        if(info.sack&&g<0)SFX.waah();else if(!info.oob)SFX.whistle();else SFX.whistle();
        if(info.oob)o.runoff=false;
        downs(newY);if(o.sub.startsWith('TURN'))o.col='#ff6b6b';}
    }
  }
  play.outcome=o;
}
function applyOutcome(){
  const o=play.outcome;
  if(o.score)game.sides[o.score[0]].score+=o.score[1];
  if(o.runoff&&!o.score)game.clock=Math.max(0,game.clock-RUNOFF());
  const pchg=o.next.poss!==game.poss;
  Object.assign(game,o.next);
  if(pchg)buildField();
  if(game.clock<=0){
    game.quarter++;
    if(game.quarter>4){state='gameover';overT=0;hype=5;confetti=[];
      const w=game.sides[0].score===game.sides[1].score?null:game.sides[0].score>game.sides[1].score?0:1;
      for(let i=0;i<120;i++)confetti.push({x:rnd()*256,y:-rnd()*200,vx:(rnd()-.5)*30,vy:25+rnd()*40,c:pick(w==null?['#ffffff','#ffe14d','#58b8f0']:[teamOf(w).c1,teamOf(w).c2,'#ffffff'])});
      SFX.td();return;}
    game.clock=QLEN();
    let title='END OF '+ORD[game.quarter-2]+' QUARTER',sub=['','NEXT UP: MORE FOOTBALL!','','4TH QUARTER: NO NAPS!'][game.quarter-1]||'';
    if(game.quarter===3){title='HALFTIME!';sub='BOTTLE BREAK! '+teamOf(1-game.firstPoss).abbr+' GETS THE BALL';
      Object.assign(game,{poss:1-game.firstPoss,ytg:75,down:1,firstYtg:65});buildField();}
    setupFormation();state='banner';banner={title,sub,t:0,dur:2.8,then:startPlaycall};SFX.whistle();
  }else startPlaycall();
}

function update(dt){
  T+=dt;hype=Math.max(0,hype-dt);updateMusic(dt);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.1);
  for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx+=Math.sin(T*3+c.y)*dt*20;}confetti=confetti.filter(c=>c.y<230);
  if(scene){scene.t+=dt;if(scene.type==='td'&&!scene.spiked&&scene.t>=1.25){scene.spiked=true;noise(.25,.6,0,500);tone(70,.25,'square',.35,0,40);giggle(.3);}
    if(scene.t>=scene.dur||(scene.t>.6&&any().aP)){const nx=scene.next;scene=null;if(nx)startScene(nx.type,nx.d,nx.dur);}return;}
  const a=any();
  if(state==='title'){
    const n=5;
    if(a.upP){menuIdx=(menuIdx+n-1)%n;SFX.blip();}if(a.downP){menuIdx=(menuIdx+1)%n;SFX.blip();}
    if(menuIdx===4&&(a.leftP||a.rightP)){quick=!quick;SFX.blip();}
    if(a.aP){SFX.select();
      if(menuIdx<2){mode=menuIdx+1;game.sides[0].human=1;game.sides[1].human=mode===2?2:0;sel={stage:0,cur:0};state='select';}
      else if(menuIdx===2)state='teams';else if(menuIdx===3)state='howto';else quick=!quick;}
  }else if(state==='teams'||state==='howto'){if(a.aP||a.bP){state='title';SFX.blip();}}
  else if(state==='select'){
    const taken=sel.stage===1?game.sides[0].team:-1;
    const mv=d=>{do{sel.cur=(sel.cur+d+4)%4;}while(sel.cur===taken);SFX.blip();};
    if(a.leftP)mv(-1);if(a.rightP)mv(1);
    if(a.aP){SFX.select();if(sel.stage===0){game.sides[0].team=sel.cur;sel.stage=1;sel.cur=(sel.cur+1)%4;}else{game.sides[1].team=sel.cur;startGame();}}
    else if(a.bP){if(sel.stage===1){sel.stage=0;sel.cur=game.sides[0].team;}else state='title';SFX.blip();}
  }else if(state==='banner'){banner.t+=dt;if(banner.t>banner.dur||(banner.t>.7&&a.aP))banner.then();}
  else if(state==='playcall'){
    const off=game.poss;pc.cpuT-=dt;
    for(const s of[0,1]){
      if(pc.done[s])continue;const hi=humanInp(s),isOff=s===off,extra=isOff&&game.down===4;
      if(hi){let cur=pc.sel[s],col=cur%2,row=cur>>1;const rows=extra?4:3;
        if(hi.leftP||hi.rightP){col=1-col;SFX.blip();}if(hi.upP){row=(row+rows-1)%rows;SFX.blip();}if(hi.downP){row=(row+1)%rows;SFX.blip();}
        pc.sel[s]=row*2+col;if(hi.aP){pc.done[s]=true;pc.choice[s]=pc.sel[s];SFX.select();}}
      else if(pc.cpuT<=0){pc.done[s]=true;pc.choice[s]=isOff?cpuOffense():cpuDefense();}
    }
    if(pc.done[0]&&pc.done[1]){pc.wait=(pc.wait||0)+dt;if(pc.wait>.45)startPresnap(pc.choice[off],pc.choice[1-off]);}
  }else if(state==='field'){
    if(play.msg){play.msg.t-=dt;if(play.msg.t<=0)play.msg=null;}
    if(play.mode==='presnap')updatePresnap(dt);
    else if(play.mode==='over'){overT+=dt;for(const p of play.players)movePlayer(p,dt,null,null);updateBall(dt);
      if(overT>play.outcome.time||(overT>1&&any().aP))applyOutcome();}
    else updateLive(dt);
    // camera
    let fx=ball.x,fy=ball.y,lead=ball.state==='held'&&play.mode!=='kick'?dirOf(ball.holder.side)*22:0;
    if(play.mode==='presnap'){fx=play.los+30;fy=75;lead=0;}else if(play.mode==='pocket'&&!play.noPass){fx=ball.x+40;lead=0;}
    const k=Math.min(1,dt*5);cam+=(clamp(fx-VW/2+lead,0,720-VW)-cam)*k;camY+=(clamp(fy*SY-204,-44,41)-camY)*k;
  }else if(state==='gameover'){overT+=dt;if(overT>1.5&&a.aP){state='title';SFX.select();}}
}

function poseOf(p){
  if(p.grounded>0)return{pose:'tackle',lying:true};
  const hold=ball.state==='held'&&ball.holder===p;
  if(play.mode==='over'&&play.outcome&&play.outcome.tdSide===p.side)return{pose:'cele'};
  if(p===play.qb&&play.relT>0)return{pose:'release'};
  if(hold&&play.mode==='pocket'&&!play.noPass&&hyp(p.vx,p.vy)<14)return{pose:'throw'};
  if(p.engaged||(p.blockT&&p.blockT.engaged===p))return{pose:'push'};
  if(hyp(p.vx,p.vy)>4)return{pose:'run'+(Math.floor(p.anim*1.2)%4),carry:hold};
  return{pose:'stand',carry:hold};
}

  p._lx=sx;p._ly=sy-(P.lying?50:78);if(sx<-60||sx>572)return;
  const ti=game.sides[p.side].team;
  let face=p.face;if(p.spin>0)face=Math.floor(p.spin*24)%2?1:-1;
  const flip=face<0,hop=P.pose==='cele'?Math.round(Math.abs(Math.sin(T*10+p.num))*7):0;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(sx-16,sy-4,32,8);ctx.fillRect(sx-12,sy-6,24,12);
  const spr=getSpr(ti,p.skin,P.pose,flip,!!P.lying,!!P.carry,p.num);
  if(P.lying)ctx.drawImage(spr,sx-30,sy-44,60,44);else ctx.drawImage(spr,sx-22,sy-60-hop,44,60);
  if(ball.state==='held'&&ball.holder===p&&!P.lying){const bs=ballSpot(P.pose,flip,P.carry)||[flip?4:17,15];ctx.drawImage(BALL,sx-22+bs[0]*2-10,sy-60-hop+bs[1]*2-9,20,18);}
  p._ly-=hop;
}

function drawStar(cx,cy,col,blink){
  const x0=Math.round(cx-13),y0=Math.round(cy-12),on=(x,y)=>y>=0&&y<12&&x>=0&&x<13&&STAR[y][x]==='#';
  for(let y=-1;y<13;y++)for(let x=-1;x<14;x++){if(on(x,y))continue;if(on(x-1,y)||on(x+1,y)||on(x,y-1)||on(x,y+1)){ctx.fillStyle='#000';ctx.fillRect(x0+x*2,y0+y*2,2,2);}}
  for(let y=0;y<12;y++)for(let x=0;x<13;x++)if(on(x,y)){ctx.fillStyle=blink&&(x+y)%4===0?'#ffffff':y<4?shade(col,.4):col;ctx.fillRect(x0+x*2,y0+y*2,2,2);}
}
function drawLabels(){
  const off=game.poss,placed=[];
  for(const p of play.players){

    const hs=[0,1].find(s=>play.ctrl[s]===p&&humanInp(s)&&play.mode!=='over'&&state==='field');
    const isCar=ball.state==='held'&&ball.holder===p;
    const ri=state==='field'&&play.mode==='pocket'&&!play.noPass&&humanInp(off)?play.recv.indexOf(p):-1;
    const line=p.role==='OL'||p.role==='DL';
    const show=showNames||((play.mode==='presnap'||state!=='field')&&!line)||isCar||hs!==undefined||ri>=0||(ball.state==='air'&&ball.target===p);
    if(!show)continue;
    const offs=p._lx<0?-1:p._lx>512?1:0;if(offs&&ri<0)continue;
    let label=ri>=0?(ri+1)+' '+p.name:p.name;if(offs)label=offs<0?'< '+label:label+' >';
    const x=offs?(offs<0?8+tw(label,2)/2:504-tw(label,2)/2):p._lx,hw=tw(label,2)/2+3;let y=clamp(p._ly,46,420);
    for(let k=0;k<4;k++){const hit=placed.find(r=>Math.abs(r.x-x)<r.hw+hw&&Math.abs(r.y-y)<17);if(!hit)break;y=hit.y-18;}

  }
}

function startScene(type,d,dur){

  if(type==='throw')SFX.throw();else if(type==='catch')SFX.catch();else if(type==='sack')setTimeout(SFX.waah,450);

function bigSpr(p,pose,x,y,flip,lying,carry,sc=3){
  const s=getSpr(game.sides[p.side].team,p.skin,pose,flip,lying,carry,p.num),w=s.width*sc,h=s.height*sc,X=Math.round(x-w/2),Y=Math.round(y-h);

function sceneBg(ti){

const fanCache={};
function fanSpr(shirt,trim,skin,hair,pose,baby,cap){
  const k=[shirt,trim,skin,hair,pose,baby,cap].join('|');if(fanCache[k])return fanCache[k];
  const w=16,h=22,g=new Uint8Array(w*h),S=(f,v)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(f(x+.5,y+.5))g[y*w+x]=v;};
  const pal=[null,shirt,skin,hair,'#2a1414','#8a2020',trim,'#ffffff'];
  const armL=pose===0?[1,3]:pose===1?[0,10]:[5,9],armR=pose===0?[15,3]:pose===1?[16,10]:[11,9];
  if(baby){S(R(4,14,11,21),1);S(L(5,15,armL[0]+1,armL[1]+3,2.4),1);S(L(10,15,armR[0]-1,armR[1]+3,2.4),1);S(E(armL[0]+1,armL[1]+3,1.3,1.3),2);S(E(armR[0]-1,armR[1]+3,1.3,1.3),2);
    S(E(8,8,5.2,5.4),2);S(AND(E(8,8,5.6,5.8),(x,y)=>y<7),6);S(R(6,8,6,8),4);S(R(10,8,10,8),4);S(E(8,11,1.6,1.2),6);S(R(8,11,8,11),7);}
  else{S(R(3,12,12,21),1);S(R(3,15,12,15),6);
    S(L(4,13,armL[0],armL[1],2.6),1);S(L(11,13,armR[0],armR[1],2.6),1);S(E(armL[0],armL[1],1.4,1.4),2);S(E(armR[0],armR[1],1.4,1.4),2);
    S(R(7,10,8,12),2);S(E(8,7,4,4.5),2);
    if(cap){S(AND(E(8,7,4.3,4.8),(x,y)=>y<5),6);S(R(9,4,13,4),6);}else S(AND(E(8,6.4,4.4,4.6),(x,y)=>y<5),3);
    S(R(6,7,6,7),4);S(R(10,7,10,7),4);if(pose!==2)S(R(7,9,9,10),5);else S(R(7,9,9,9),4);}
  const c=mkc(w,h),x=c.getContext('2d');
  const at=(a,b)=>a<0||b<0||a>=w||b>=h?0:g[b*w+a];
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const v=g[y*w+i];let col=null;
    if(v){col=pal[v];if(at(i+1,y+1)!==v&&at(i-1,y-1)===v&&v!==4&&v!==5)col=shade(pal[v],-.22);}
    else if(at(i-1,y)||at(i+1,y)||at(i,y-1)||at(i,y+1))col='#0e0e14';
    if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}}
  return fanCache[k]=c;
}
const HAIR=['#2a1a10','#6b3e1e','#e8c15a','#111111','#a8432a','#d9d9d9'];
function drawFans(ti){
  const t=TEAMS[ti],q=TEAMS[game.sides[0].team===ti?game.sides[1].team:game.sides[0].team];
  ctx.fillStyle='#10132e';ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#0b0d22';ctx.fillRect(0,by-2,W,3);
    for(let i=0,x=-off;x<W+step;i++,x+=step){
      const hsh=((i+1)*2654435761^(r+3)*40503)>>>0,opp=hsh%11===0;

        const sw=tw(msg)+8,sx=Math.round(x+fw/2-sw/2),sy=Math.round(by-fh-14+bob);
        ctx.fillStyle='#0e0e14';ctx.fillRect(sx-1,sy-1,sw+2,13);ctx.fillStyle='#ffffff';ctx.fillRect(sx,sy,sw,11);txt(msg,sx+4,sy+2,t.c1==='#c3c9d1'?'#141414':t.c1);}
      if(r===2&&hsh%5===3&&!opp){const fx=Math.round(x+fw-10),fy=Math.round(by-fh-22+bob);ctx.fillStyle='#0e0e14';ctx.fillRect(fx-1,fy-1,12,30);ctx.fillStyle=t.c1;ctx.fillRect(fx,fy+8,10,20);ctx.fillRect(fx+3,fy,4,9);txt('1',fx+3,fy+12,'#ffffff');}
    }
  });
}
const pick2=(h,a)=>a[h%a.length];
function caption(h,sub,col){panel(6,180,244,40,col);txt(h,128,186,'#ffe14d',h.length>19?1:2,'center');txt(sub,128,207,'#ffffff',1,'center');}
function drawScene(){
  const s=scene,u=s.t,t=TEAMS[s.team],tc=t.c1==='#141414'?'#ffffff':t.c1;
  UI();sceneBg(s.team);
  const jump=(k,amp)=>Math.round(Math.max(0,Math.sin(Math.min(1,k)*Math.PI))*amp);
  if(s.type==='throw'){
    const o=bigSpr(s.p,u<.5?'throw':'release',80,172,false,false,false);
    if(u<.5){const b=POSES.throw.ball;bigBall(o.x+b[0]*3+1,o.y+b[1]*3+1);}
    else{const k=Math.min(1,(u-.5)/.8);bigBall(100+k*190,70-k*60,k<.4?3:2);}
    caption(s.p.name+' LETS IT FLY!','BOMBS AWAY!',tc);
  }else if(s.type==='catch'||s.type==='int'){
    const main=s.p,other=s.type==='int'?s.rec:s.def,mflip=s.type==='int';
    if(other)bigSpr(other,'catch',mflip?92:176,172-jump(u/1.3,10),!mflip,false,false);
    const jy=172-jump(u/1.3,24),o=bigSpr(main,'catch',134,jy,mflip,false,false);
    const k=Math.min(1,u/.8),bs=ballSpot('catch',mflip,false),hx=o.x+bs[0]*3+1,hy=o.y+bs[1]*3+2;
    const sx0=mflip?280:-20;bigBall(sx0+(hx-sx0)*k,10+(hy-10)*k-Math.round(Math.sin(k*Math.PI)*30));
    if(s.type==='int')caption('PICKED OFF BY '+main.name+'!','NAP TIME! WAAAH!','#ff6b6b');
    else caption(main.name+' MAKES THE CATCH!',s.def?'RIGHT OVER '+s.def.name+'!':'WHAT A GRAB!',tc);
  }else if(s.type==='sack'){
    const qb=s.p,d=s.def;
    if(u<.5){bigSpr(qb,'throw',100,172,false,false,false);const k=u/.5;bigSpr(d,'run'+(Math.floor(u*14)%4),290-k*160,172,true,false,false);}
    else{bigSpr(qb,'tackle',96,176,true,true,false);bigSpr(d,'tackle',128,164,true,true,false);
      bigBall(64-(u-.5)*40,150-Math.abs(Math.sin((u-.5)*8))*30*Math.max(0,1-(u-.5)),2);
      for(let i=0;i<5;i++){const a=T*4+i*1.256;ctx.fillStyle='#ffe14d';ctx.fillRect(Math.round(110+Math.cos(a)*34),Math.round(110+Math.sin(a)*10),3,3);}
      otxt('WAAAH!',110,84,'#ffffff',2,'center');}
    caption('SACK!',d.name+' SQUASHES '+qb.name+'!','#ff6b6b');
  }else if(s.type==='td'){
    // end zone turf with the team's mascot painted on it
    let y=128,h=4,i=0;while(y<180){ctx.fillStyle=i%2?shade(t.jersey,-.15):shade(t.jersey,-.3);ctx.fillRect(0,y,W,h);y+=h;h+=3;i++;}
    ctx.globalAlpha=.35;txt(t.mascot,128,150,'#ffffff',t.mascot.length>10?2:3,'center');ctx.globalAlpha=1;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,128,W,2);
    ctx.drawImage(LOGOS[s.team],6,124,48,48);ctx.drawImage(LOGOS[s.team],202,124,48,48);
    const GY=172;
    if(u<.6){const x=-20+u/.6*148,pose='run'+(Math.floor(u*14)%4),o=bigSpr(s.p,pose,x,GY,false,false,true),bs=ballSpot(pose,false,true);bigBall(o.x+bs[0]*3+1,o.y+bs[1]*3+1);}
    else if(u<1.1){const o=bigSpr(s.p,'spikeUp',128,GY,false,false,false),bs=POSES.spikeUp.ball;bigBall(o.x+bs[0]*3+1,o.y+bs[1]*3+2);
      if(u>.75)otxt('...',150,58,'#ffffff',2,'left');}
    else if(u<1.25){const o=bigSpr(s.p,'spikeDown',128,GY,false,false,false),k=(u-1.1)/.15;bigBall(o.x+63+k*8,o.y+60+k*(GY-6-o.y-60));}
    else{
      const k=u-1.25,hop=k>.5?Math.round(Math.abs(Math.sin(u*9))*10):0;
      bigSpr(s.p,k>.5?'cele':'spikeDown',128,GY-hop,false,false,false);
      if(k<.45){const r=10+k*90;ctx.fillStyle='#ffe14d';for(let a=0;a<12;a++){const an=a*Math.PI/6;for(let q=0;q<4;q++)ctx.fillRect(Math.round(154+Math.cos(an)*(r+q*3)),Math.round(GY-4+Math.sin(an)*(r+q*3)*.5),3,3);}}
      const bx=154+k*120,by=GY-6-Math.round(Math.sin(Math.min(1,k/1.1)*Math.PI)*120);bigBall(bx,by,k<.4?3:2);
      otxt('SPIKE!',172,70,Math.floor(T*10)%2?'#ffe14d':'#ffffff',3,'center');
    }
    otxt('TOUCHDOWN!',128,10,[t.c1,'#ffffff','#ffe14d'][Math.floor(T*8)%3],3,'center');
    caption(s.p.name+' SCORES!',s.sub||'+7',tc);
  }else if(s.type==='fg'){

    const pose=u<.35?'stand':u<.8?'kick':'stand';bigSpr(s.p,pose,70,172,false,false,false);
    if(u<.4)bigBall(104,166,2);
    else{const k=Math.min(1,(u-.4)/1.1),tx=s.good?190:190+s.miss*55;bigBall(104+(tx-104)*k,166+(80-166)*k-Math.round(Math.sin(k*Math.PI)*40),k<.35?3:k<.7?2:1);}

// ================= LOOP + LAYOUT =================
function fit(){
  const touchPad=document.body.classList.contains('touch')?0:40;
  const aw=innerWidth-28,ah=innerHeight-touchPad-28;
  let s=Math.min(aw/CW,ah/CH);if(s>=1)s=Math.floor(s*4)/4;s=Math.max(.5,s);
  cv.style.width=Math.round(CW*s)+'px';cv.style.height=Math.round(CH*s)+'px';
}
addEventListener('resize',fit);
// touch
if(matchMedia('(pointer: coarse)').matches){
  document.body.classList.add('touch');touch.active=true;
  const st=document.getElementById('stick'),kn=document.getElementById('knob');
  const mv=e=>{const r=st.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    touch.x=dx>18?1:dx<-18?-1:0;touch.y=dy>18?1:dy<-18?-1:0;const l=Math.min(40,hyp(dx,dy)),a=Math.atan2(dy,dx);
    kn.style.transform='translate('+Math.cos(a)*l+'px,'+Math.sin(a)*l+'px)';};
  st.addEventListener('pointerdown',e=>{initAudio();st.setPointerCapture(e.pointerId);mv(e);});
  st.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')mv(e);});
  const up=()=>{touch.x=touch.y=0;kn.style.transform='';};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  for(const[id,k]of[['bA','a'],['bB','b']]){const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();touch[k]=true;});
    for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{touch[k]=false;});}
}
fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollInput();if(!paused)update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
